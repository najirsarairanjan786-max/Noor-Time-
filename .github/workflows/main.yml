name: Build iOS Project

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/ios

      - name: Add iOS platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync iOS
        run: npx cap sync ios

      - name: Create iOS ZIP
        run: |
          mkdir -p output
          zip -r output/Noor-Time-iOS.zip ios package.json package-lock.json capacitor.config.* 2>/dev/null || true

      - name: Upload iOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Time-iOS
          path: output/Noor-Time-iOS.zip
          if-no-files-found: error

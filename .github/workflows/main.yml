name: Create iOS Project

on:
  workflow_dispatch:

jobs:
  create-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor iOS
        run: npm install @capacitor/ios

      - name: Add iOS platform
        run: npx cap add ios || true

      - name: Sync iOS
        run: npx cap sync ios

      - name: Create iOS ZIP
        run: |
          mkdir -p output
          zip -r output/Noor-Time-iOS-Project.zip ios

      - name: Upload iOS Project
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Time-iOS-Project
          path: output/Noor-Time-iOS-Project.zip

name: Create iOS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web application
        run: npm run build

      - name: Install Capacitor iOS
        run: npm install @capacitor/ios@^8.4.2

      - name: Create iOS platform if needed
        run: |
          if [ -d "ios" ]; then
            echo "iOS platform already exists"
          else
            npx cap add ios
          fi

      - name: Sync iOS
        run: npx cap sync ios

      - name: Save iOS project to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ios package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Build and add iOS project"
            git push
          fi

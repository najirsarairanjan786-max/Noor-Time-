<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="theme-color" content="#064E3B" />
    <title>Islamic Home Screen</title>
  
    <script>
      // EMERGENCY CLEANUP: Run before ANY ES modules or Firebase code loads
      try {
        var keysToRemove = [];
        for (var i = 0; i < localStorage.length; i++) {
          var key = localStorage.key(i);
          if (key && (key.startsWith('firestore_') || key.startsWith('jantri_') || key.startsWith('quran_') || key.startsWith('adhan_') || key.startsWith('hijri_') || key.startsWith('islamic_'))) {
            keysToRemove.push(key);
          }
        }
        for (var j = 0; j < keysToRemove.length; j++) {
          localStorage.removeItem(keysToRemove[j]);
        }
        console.log('Emergency pre-boot cleanup completed.');
      } catch(e) {}
    </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

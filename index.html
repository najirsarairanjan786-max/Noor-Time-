<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#064E3B" />
    <title>Islamic Home Screen</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // EMERGENCY STORAGE CLEANUP - RUNS BEFORE ANY BUNDLE
      try {
        var keysRemoved = 0;
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (k && (
            k.startsWith('quran_juz_') || 
            k.startsWith('quran_surah_') || 
            k.startsWith('quran_page_') ||
            k.startsWith('calendar_') || 
            k.startsWith('jantri_cal_') || 
            k.startsWith('prayer_times_') ||
            k.startsWith('hijri_date_') ||
            k.startsWith('jantri_book_data_')
          )) {
            localStorage.removeItem(k);
            keysRemoved++;
          }
        }
        if (keysRemoved > 0) {
          console.log("Emergency cleanup removed " + keysRemoved + " heavy items from localStorage.");
        }
      } catch (e) {
        console.warn("Failed emergency cleanup", e);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
